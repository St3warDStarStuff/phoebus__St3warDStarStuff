name: gpu build testing

on:
  push:
    branches: [main, gpu_unit_tests]
  pull_request:
    branches: [ main, gpu_unit_tests ]
  # Run workflow on the 1st and 15th of every month at 12:33 AM PST (UTC-8)
  schedule:
    - cron: '33 12 1,15 * *'

jobs:
  phoebus_compile_and_build:
    runs-on:
      group: Default
      labels: gpu

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # This forces GitHub to automatically pull down parthenon, singularity-eos, and kokkos
          submodules: recursive

      - name: Verify nvcc installation
        run: |
          # Add CUDA binaries and libraries to the active environment path
          export PATH=/usr/local/cuda/bin:$PATH
          export LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
          
          # Now verify it works
          nvcc --version

      - name: Setup OS and compile
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'g++'
          uses_mpi: "false"
      - name: Compile and build Phoebus - cuda
        uses: ./.github/actions/compile_and_build_phoebus/cuda
        with:
          compiler: 'g++'