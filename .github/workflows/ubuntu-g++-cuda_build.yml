name: cuda g++ build

on:
  push:
    branches: [main, gpu_unit_tests]
  pull_request:
    branches: [ main, gpu_unit_tests ]
jobs:
  phoebus_compile_and_build:
    runs-on:
      group: Default
      labels: gpu

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # This forces GitHub to automatically pull down parthenon, singularity-eos, and kokkos
          submodules: recursive

      - name: Setup OS and compile
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'g++'
          uses_mpi: "false"

      - name: Verify nvcc installation
        run: nvcc --version     

      - name: Compile and build Phoebus - cuda
        uses: ./.github/actions/compile_and_build_phoebus/cuda
        with:
          compiler: 'g++'